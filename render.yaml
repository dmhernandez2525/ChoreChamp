# ChoreChamp Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Services deployed:
# - chorechamp-db (PostgreSQL free tier)
# - chorechamp-api (Node.js API)
# - chorechamp-site (Static web app)
#
# Note: rootDir is set to repo root to handle pnpm workspaces properly
# Note: NODE_ENV=development is set during install to include devDependencies

services:
  # Web App (Static)
  - type: web
    runtime: static
    name: chorechamp-site
    # Root dir is repo root to support pnpm workspaces
    buildCommand: npm install -g pnpm && NODE_ENV=development pnpm install && pnpm --filter @chorechamp/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_DEMO_MODE
        value: "true"
      - key: VITE_API_URL
        sync: false
      - key: VITE_STRIPE_PUBLIC_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # API Server
  - type: web
    runtime: node
    name: chorechamp-api
    plan: free
    # Root dir is repo root to support pnpm workspaces
    # NODE_ENV=development during install to get devDependencies (esbuild, etc.)
    buildCommand: npm install -g pnpm && NODE_ENV=development pnpm install && pnpm --filter @chorechamp/api build
    startCommand: cd apps/api && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: chorechamp-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_FAMILY_MONTHLY
        sync: false
      - key: STRIPE_PRICE_FAMILY_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PREMIUM_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PREMIUM_ANNUAL
        sync: false
      - key: STRIPE_PRICE_FAMILY_MONTHLY_GRANDFATHERED
        sync: false
      - key: STRIPE_PRICE_FAMILY_ANNUAL_GRANDFATHERED
        sync: false
      - key: STRIPE_PRICE_PREMIUM_MONTHLY_GRANDFATHERED
        sync: false
      - key: STRIPE_PRICE_PREMIUM_ANNUAL_GRANDFATHERED
        sync: false
      - key: SUBSCRIPTION_GRACE_PERIOD_DAYS
        value: "7"
      - key: SUBSCRIPTION_GRANDFATHERED_CUTOFF_DATE
        sync: false

# PostgreSQL Database
databases:
  - name: chorechamp-db
    plan: free
    databaseName: chorechamp
    user: chorechamp
