# ChoreChamp Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Services deployed:
# - chorechamp-db (PostgreSQL free tier)
# - chorechamp-api (Node.js API)
# - chorechamp-site (Static web app)

services:
  # Web App (Static)
  - type: web
    runtime: static
    name: chorechamp-site
    rootDir: apps/web
    buildCommand: cd ../.. && npm install -g pnpm && pnpm install && pnpm --filter @chorechamp/web build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # API Server
  - type: web
    runtime: node
    name: chorechamp-api
    rootDir: apps/api
    plan: free
    buildCommand: cd ../.. && npm install -g pnpm && pnpm install && pnpm --filter @chorechamp/api build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: chorechamp-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

# PostgreSQL Database
databases:
  - name: chorechamp-db
    plan: free
    databaseName: chorechamp
    user: chorechamp
